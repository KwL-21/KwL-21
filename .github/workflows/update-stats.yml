name: Atualizar estatísticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=KwL-21
            &show_icons=true
            &include_all_commits=true
            &count_private=true
            &show=reviews,prs_merged,prs_merged_percentage
            &theme=transparent
            &hide_border=true
            &locale=pt-br
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=KwL-21
            &layout=compact
            &langs_count=8
            &theme=transparent
            &hide_border=true
            &locale=pt-br
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Publicar cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza estatísticas do perfil" || exit 0
          git push
